[package]
name = "creature_simulator"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "creature_simulator"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["experimental-inspect"] }

wgpu = "30.0.0"
winit = "0.30.13"
env_logger = "0.11.11"
log = "0.4.33"
pollster = "0.4.0"
rapier3d = "0.34.0"
glam = { version = "0.33", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
rand = "0.10.2"
crossbeam = "0.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
